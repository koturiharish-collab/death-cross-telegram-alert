
name: Combined Golden and Death Cross Scanner

on:
  schedule:
    # Every 15 minutes, Monday-Friday.
    # UTC schedule = 08:32 to 16:17 IST.
    - cron: "2,17,32,47 3-10 * * 1-5"

  workflow_dispatch:
    inputs:
      test:
        description: "Send a Telegram test message only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: combined-ema-cross
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run combined scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          SHARE_SANKET_TOKEN: ${{ secrets.SHARE_SANKET_TOKEN }}
          SHARE_SANKET_REPO: sharesanket/corporate-actions.yml
          SHARE_SANKET_BRANCH: main

          FAST_MA: "50"
          SLOW_MA: "200"
          MA_TYPE: "EMA"

          ENABLE_GOLDEN: "true"
          ENABLE_DEATH: "true"

          INCLUDE_LIVE_BAR: "false"
          FRESH_BARS: "1"

          NSE_ALL: "true"
          NSE_SERIES: "EQ"
          MIN_AVG_VOLUME: "0"
          BATCH_SIZE: "150"

        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python death_cross.py --test
          else
            python death_cross.py
          fi

      - name: Save scanner state
        if: always()
        run: |
          git add state.json nse_equities.txt 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "Update combined EMA cross scanner state"

            git pull --rebase origin main
            git push origin main
          fi
