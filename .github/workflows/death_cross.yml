name: NSE Fresh Death Cross Alert

on:
  schedule:
    # 10:15 UTC = 15:45 IST
    - cron: "15 10 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # SETUP PYTHON
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # RUN DEATH CROSS SCANNER
      # --------------------------------------------------
      - name: Run Fresh Death Cross Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python death_cross.py

      # --------------------------------------------------
      # MAKE SURE STATE FILE EXISTS
      # --------------------------------------------------
      - name: Ensure death state exists
        run: |
          if [ ! -f death_alert_state.json ]; then
            echo "{}" > death_alert_state.json
          fi

      # --------------------------------------------------
      # SAVE DEATH CROSS STATE
      # --------------------------------------------------
      - name: Save death alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add death_alert_state.json

          if git diff --cached --quiet; then
            echo "No new death cross alert state to save."
          else
            git commit -m "Update death cross alert state"
            git push
          fi
